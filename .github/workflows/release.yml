name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^[vV]', ''
          } else {
            $version = "0.1.${{ github.run_number }}"
          }
          if ([string]::IsNullOrWhiteSpace($version) -or $version -notmatch '^\d+\.\d+\.\d+') {
            $version = "0.1.${{ github.run_number }}"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "version=$version ref_type=$env:GITHUB_REF_TYPE ref_name=$env:GITHUB_REF_NAME"

      - name: Restore
        run: dotnet restore Siming.slnx

      - name: Build
        run: dotnet build Siming.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/Siming.Tests/Siming.Tests.csproj -c Release --no-build --logger "console;verbosity=minimal"

      - name: Publish framework-dependent
        run: dotnet publish src/Siming.App/Siming.App.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -p:Version=$env:VERSION -o artifacts/thin

      - name: Publish self-contained
        run: dotnet publish src/Siming.App/Siming.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=$env:VERSION -o artifacts/selfcontained

      - name: Package
        run: |
          $ErrorActionPreference = 'Stop'

          function New-Package {
            param([string]$SourceDir, [string]$ZipPath)
            $stage = Join-Path $env:RUNNER_TEMP ("siming-" + [Guid]::NewGuid().ToString('N'))
            $root = Join-Path $stage 'Siming'
            New-Item -ItemType Directory -Path $root -Force | Out-Null
            New-Item -ItemType Directory -Path (Join-Path $root 'docs') -Force | Out-Null
            Copy-Item (Join-Path $SourceDir 'Siming.exe') (Join-Path $root 'Siming.exe')
            Copy-Item 'README.md' (Join-Path $root 'README.md')
            Copy-Item 'processes.sample.json' (Join-Path $root 'processes.sample.json')
            Copy-Item -Path 'docs/*' -Destination (Join-Path $root 'docs') -Recurse -Force
            Compress-Archive -Path $root -DestinationPath $ZipPath -Force
            Remove-Item $stage -Recurse -Force
          }

          New-Package 'artifacts/thin' 'artifacts/Siming-win-x64.zip'
          New-Package 'artifacts/selfcontained' 'artifacts/Siming-win-x64-selfcontained.zip'

          Get-ChildItem 'artifacts/*.zip' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content 'artifacts/SHA256SUMS.txt' -Encoding ascii

          Get-ChildItem 'artifacts' | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Siming-${{ github.run_id }}
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create or update release
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-LastExit([string]$Message) {
            if ($LASTEXITCODE -ne 0) {
              throw "$Message (exit $LASTEXITCODE)"
            }
          }

          $assetPaths = @(
            'artifacts/Siming-win-x64.zip',
            'artifacts/Siming-win-x64-selfcontained.zip',
            'artifacts/SHA256SUMS.txt'
          ) | Where-Object { Test-Path $_ }

          $commitUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA"
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $downloads = @(
            '**下载**',
            '- `Siming-win-x64.zip`：框架依赖版（压缩包约 1.3 MB，解压后 exe 约 4 MB），需要 .NET 10 Desktop Runtime',
            '- `Siming-win-x64-selfcontained.zip`：自包含版（压缩包约 45 MB，解压后 exe 约 51 MB），无需安装 .NET',
            '- `SHA256SUMS.txt`：ZIP 文件的 SHA-256 校验和',
            '',
            '解压后运行 `Siming.exe`。使用说明见压缩包内的 `README.md`。'
          )

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $notes = @(
              "**司命 $tag**",
              '',
              "提交：$commitUrl",
              "构建：$runUrl",
              ''
            ) + $downloads
            $notes -join "`n" | Set-Content 'release-notes.md' -Encoding utf8

            gh release view $tag --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag @assetPaths --clobber
              Assert-LastExit 'gh release upload failed'
              gh release edit $tag --title "司命 $tag" --notes-file 'release-notes.md'
              Assert-LastExit 'gh release edit failed'
            } else {
              gh release create $tag @assetPaths --title "司命 $tag" --notes-file 'release-notes.md' --verify-tag
              Assert-LastExit 'gh release create failed'
            }
          } else {
            $tag = 'latest'
            git tag -f $tag $env:GITHUB_SHA
            Assert-LastExit 'git tag failed'
            git push origin $tag --force
            if ($LASTEXITCODE -ne 0) {
              Write-Warning '无法更新 latest 标签，将继续更新 Release 资产。'
            }

            $notes = @(
              '**司命 · 最新构建**',
              '',
              ('由 `' + $env:GITHUB_REF_NAME + '` 的最新提交自动构建，不是稳定版本；稳定版本请使用 `v*` 标签的 Release。'),
              '',
              "提交：$commitUrl",
              "构建：$runUrl",
              ''
            ) + $downloads
            $notes -join "`n" | Set-Content 'release-notes.md' -Encoding utf8

            gh release view $tag --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag @assetPaths --clobber
              Assert-LastExit 'gh release upload failed'
              gh release edit $tag --title '司命 · 最新构建' --notes-file 'release-notes.md' --prerelease
              Assert-LastExit 'gh release edit failed'
            } else {
              gh release create $tag @assetPaths --title '司命 · 最新构建' --notes-file 'release-notes.md' --prerelease --target $env:GITHUB_SHA
              Assert-LastExit 'gh release create failed'
            }
          }
